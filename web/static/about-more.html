<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rotaract Events</title>
<meta name="robots" content="noindex">
<!-- the app moved to one page with hash routes (#/about-more); old links and bookmarks forward there, query included -->
<script>
var p = new URLSearchParams(location.search), id = null, lang = p.get("lang");
p.delete("id"); p.delete("lang");
var q = p.toString();
location.replace("./" + (lang ? "?lang=" + encodeURIComponent(lang) : "") + "#/about-more" + (id ? "/" + encodeURIComponent(id) : "") + (q ? "?" + q : ""));
</script>
</head>
<body><a href="./#/about-more">Rotaract Events</a></body>
</html>
