# One entry per club. `id` becomes the feed file name: public/<id>.ics
# Source: club menu on https://rotaract.ch/de/organisation/ (2026-11).
#   lang     = Polaris URL language, also used for the "cancelled" label
#   city     = fallback location for the radius search when an event has none
#   backfill = on the club's first run, import every past year Polaris offers
#              (otherwise history starts with the current year)
#   short    = label on the club chips in the app
#   color    = club colour in the app: the dominant tint of its crest (change freely)
#   logo     = crest shown in the app: the canton's coat of arms, or the city's for city clubs
#              (web/static/crests/, from Wikimedia Commons; Swiss/LI official coats of arms are public domain)
#   photos   = optional list of picture URLs for the strip on the club page (otherwise: pictures of past events)
#   instagram, linkedin = optional profile links, shown as buttons on the club page. With the Instagram secrets set
#              (docs/layers.md, "Instagram pictures"), the club's latest Instagram pictures also replace the picture strip.
#   district = Rotary district: 1980 central/north-west, 1990 west, 2000 east; empty = national
#   about    = optional one sentence that introduces the club, shown in "About this club" on the club page
#   how      = optional "how to join" text, in the club's own language, opened from a button on the club page. Plain text
#              with a little structure: "## Heading", "1. Title: text" (numbered step cards), "- point" (check list),
#              **bold**. A blank line ends a paragraph.
#   partners = optional list of clubs this club works with, shown as links on the club page:
#              partners = [{ name = "Rotary Club Luzern", url = "https://...", note = "Patenclub" }]
#              Another club in this file: url = "club.html?id=<id>" (opens its club page in the app)
#   source   = "international" marks the one entry that is not a Polaris site (see the end of this file);
#              "rotary" marks a Rotary district: the events its Rotary clubs share with other clubs, read from the
#              district site's lists only. A separate layer: off by default in the app, never in all.ics.

[[clubs]]
id = "luzern"
logo = "crests/luzern.svg"
district = "1980"
short = "Luzern"
color = "#0b5cad"
name = "Rotaract Luzern"
base_url = "https://rotaract-luzern.ch"
lang = "de"
city = "Luzern"
backfill = true
instagram = "https://www.instagram.com/racluzern/"
about = "Junge Leute aus der Region Luzern, die zusammen lernen, helfen und feiern. Gäste sind jederzeit willkommen."
how = """
## In drei Schritten dabei
1. Schreib uns: Melde dich bei luzern@rotaract.ch und frag, ob du an einen Anlass kommen kannst.
2. Komm vorbei: Als Gast kostet das nichts und verpflichtet zu nichts. Wir möchten dich an **zwei bis drei Anlässen** kennenlernen, mehr geht immer.
3. Werde Mitglied: Aufgenommen wird an der **GV im Sommer** oder an der **Mini-GV im Januar**.

## Gut zu wissen
- Jährlicher Mitgliederbeitrag
- Du organisierst **einen Anlass pro Jahr**
- Nach ein bis zwei Jahren übernimmst du für ein Jahr **ein Amt im Vorstand**
"""
