# One entry per club. `id` becomes the feed file name: public/<id>.ics
# Source: club menu on https://rotaract.ch/de/organisation/ (2026-11).
#   lang     = Polaris URL language, also used for the "cancelled" label
#   city     = fallback location for the radius search when an event has none
#   backfill = on the club's first run, import every past year Polaris offers
#              (otherwise history starts with the current year)
#   short    = label on the club chips in the app
#   color    = club colour in the app: the dominant tint of its crest (change freely)
#   logo     = crest shown in the app: the canton's coat of arms, or the city's for city clubs
#              (site/crests/, from Wikimedia Commons; Swiss/LI official coats of arms are public domain)
#   photos   = optional list of picture URLs for the strip on the club page (otherwise: pictures of past events)
#   district = Rotary district: 1980 central/north-west, 1990 west, 2000 east; empty = national

[[clubs]]
id = "luzern"
logo = "crests/luzern.svg"
district = "1980"
short = "Luzern"
color = "#0b5cad"
name = "Rotaract Luzern"
base_url = "https://rotaract-luzern.ch"
lang = "de"
city = "Luzern"
backfill = true

