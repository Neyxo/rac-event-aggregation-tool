<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Rotary family · Rotaract Events</title>
<meta name="description" content="Rotary, Rotaract, Interact, Rotex, RYLA, Inner Wheel, the Foundation and the districts, in one line each, and the Rotaract clubs of Switzerland and Liechtenstein.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
</head>
<body data-page="family">
<header id="top"></header>
<main class="wrap fam" id="main">
  <h1 data-t="fam_h"></h1>
  <p class="lead" data-t="fam_lead"></p>
  <!-- one tile per part of Rotary: icon, name, half a sentence -->
  <div class="tiles2" id="tiles"></div>
  <h2 data-t="fam_clubs"></h2>
  <div id="dist"></div>
  <div id="foot"></div>
</main>
<nav class="tabs-bar" id="tabs" aria-label="Main"></nav>
<div class="toast" id="toast" role="status"></div>
<script defer>
addEventListener("DOMContentLoaded", async () => {
  applyI18n(); chrome("about", { back: true });
  const ICONS = [["wheel", "#0067c8"], ["users", "#d41367"], ["book", "#009739"], ["plane", "#0067c8"], ["flag", "#d41367"], ["rings", "#009739"], ["heart", "#0067c8"], ["pin", "#d41367"]];
  // logos in site/img/fam (Rotary and RYLA from Wikimedia Commons, Interact from Commons, Rotex and Inner Wheel from their sites); the icon stands in where there is none yet
  const LOGOS = ["img/fam/rotary.svg", "rotaract.svg", "img/fam/interact.png", "img/fam/rotex.svg", "img/fam/ryla.png", "img/fam/innerwheel.png", "img/fam/foundation.png", ""];
  const mark = i => { if (!LOGOS[i]) return el("div", { class: "ic" }, icon(ICONS[i][0])); const im = el("img", { class: "logo", src: LOGOS[i], alt: "" }); im.addEventListener("error", () => im.replaceWith(el("div", { class: "ic" }, icon(ICONS[i][0])))); return im; };
  $("tiles").append(...t("fam").map(([name, text], i) => el("div", { class: "ft glass", style: `--p:${ICONS[i][1]}` }, mark(i), el("b", {}, name), el("span", {}, text))));
  await loadData();
  for (const d of ["1980", "1990", "2000"]) $("dist").append(el("h3", {}, t("d" + d)), el("div", { class: "tiles" }, ...D.data.clubs.filter(c => c.district === d).map(c => el("a", { class: "tile", href: "club.html?id=" + c.id, style: clubStyle(c.id) }, clubMark(c), el("b", {}, c.short)))));
  $("foot").append(footer());
});
</script>
</body>
</html>
