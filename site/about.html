<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What is Rotaract? · Rotaract Events</title>
<meta name="description" content="Rotaract in one minute: learn, help, celebrate. Find the club nearest to you in Switzerland and Liechtenstein.">
<meta property="og:title" content="What is Rotaract?">
<meta property="og:description" content="Learn. Help. Celebrate. Find the Rotaract club nearest to you.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
</head>
<body data-page="about">
<header id="top"></header>
<main class="wrap about" id="main">
  <!-- the morph: closed at first (three stacked words); scrolling opens Learn, then Help, then Celebrate -->
  <div class="track" id="track">
    <div class="stage" id="stage">
      <div class="prog" id="prog" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="words" id="words"></div>
      <div class="hint" aria-hidden="true"><span data-t="scroll"></span><i>⌄</i></div>
    </div>
  </div>
  <section class="after">
    <h2 data-t="ab_people"></h2>
    <p class="lead" data-t="ab_people_t"></p>
    <div id="cta"></div>
    <h3 class="sh" data-t="read_on"></h3>
    <div id="more"></div>
    <h3 class="sh" data-t="faq"></h3>
    <div class="qa" id="qa"></div>
    <div id="foot"></div>
  </section>
</main>
<nav class="tabs-bar" id="tabs" aria-label="Main"></nav>
<div class="toast" id="toast" role="status"></div>
<script defer>
addEventListener("DOMContentLoaded", async () => {
  applyI18n(); wash("#0067c8", "#009739", "#d41367");
  const share = el("button", { class: "hbtn", type: "button", title: t("ab_share") }, icon("share"), el("span", {}, t("share")));
  share.addEventListener("click", async () => { const data = { title: t("ab_title"), text: t("ab_lead"), url: location.href.split("?")[0] }; if (navigator.share) { try { await navigator.share(data); } catch {} } else { await navigator.clipboard.writeText(data.url); toast(t("copied")); } });
  chrome("about", { extra: share });
  const PIL = [["learn", "#0067c8"], ["help", "#009739"], ["party", "#d41367"]];
  for (let i = 1; i <= 5; i++) $("qa").append(el("details", { name: "qa" }, el("summary", {}, t("ab_q" + i)), el("p", {}, t("ab_a" + i))));
  await loadData();
  document.querySelector("[data-t=ab_people_t]").textContent = t("ab_people_t", { n: nClubs() });
  if (!D.clubs[D.settings.home]) $("cta").append(ctaBlock());
  $("more").append(...helpLinks("guide", "words", "intl", "world", "family"));
  $("foot").append(footer());
  const words = $("words");
  PIL.forEach(([k, col], i) => words.append(el("div", { class: "w", style: `--p:${col}` }, el("div", { class: "word" }, t("ab_" + k) + "."),
    el("div", { class: "open" }, el("div", {}, el("div", { class: "pic" }, pillarPic(k)), el("p", {}, t("ab_" + k + "_t")))))));
  // phase -1 = closed, 0..2 = that word open. Scroll range split into four parts with a little hysteresis so it never flickers at a boundary.
  let cur = -2;
  const set = i => { if (i === cur) return; cur = i; [...words.children].forEach((w, k) => w.classList.toggle("on", k === i)); words.classList.toggle("closed", i < 0); [...$("prog").children].forEach((d, k) => d.classList.toggle("on", k === i)); $("stage").style.setProperty("--p", i < 0 ? "#d41367" : PIL[i][1]); };
  const onScroll = () => {
    const tr = $("track"), r = tr.getBoundingClientRect(), range = tr.offsetHeight - innerHeight;
    const p = range > 0 ? Math.min(1, Math.max(0, -r.top / range)) : 1;
    const raw = p * 4 - 1, next = Math.max(-1, Math.min(2, Math.floor(raw + (raw > cur ? -0.08 : 0.08))));
    set(next);
  };
  addEventListener("scroll", onScroll, { passive: true }); addEventListener("resize", onScroll); onScroll();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { words.classList.remove("closed"); [...words.children].forEach(w => w.classList.add("on")); }
});
</script>
</body>
</html>
