<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What is Rotaract? · Rotaract Events</title>
<meta name="description" content="Rotaract in one minute: learn, help, celebrate. Find the club nearest to you in Switzerland and Liechtenstein.">
<meta property="og:title" content="What is Rotaract?">
<meta property="og:description" content="Learn. Help. Celebrate. Find the Rotaract club nearest to you.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
</head>
<body data-page="about">
<header>
  <div class="wrap bar">
    <a class="brand" href="./"><img src="rotaract.svg" alt="Rotaract"><span data-t="events"></span></a>
    <nav class="actions" id="actions"><button class="icon-btn" id="share" type="button" data-t="ab_share"></button><a class="icon-btn" href="./" data-t="home"></a></nav>
  </div>
</header>
<main class="wrap about">
  <!-- the morph: three stacked words; the active one opens with picture and line while the others shrink out of the way -->
  <div class="track" id="track">
    <div class="stage" id="stage">
      <div class="prog" id="prog" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="words" id="words"></div>
      <div class="hint" aria-hidden="true"><span data-t="scroll"></span><i>⌄</i></div>
    </div>
  </div>
  <section class="after">
    <h2 data-t="ab_people"></h2>
    <p class="lead" data-t="ab_people_t"></p>
    <div id="cta"></div>
    <a class="more" href="about-more.html"><b data-t="ab_more"></b><span data-t="ab_more_sub"></span></a>
    <h3 data-t="faq"></h3>
    <div class="qa" id="qa"></div>
  </section>
  <footer><span data-t="made_by"></span> · <a href="https://github.com/Neyxo/rac-event-aggregation-tool" target="_blank" rel="noopener" data-t="source"></a></footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script defer>
addEventListener("DOMContentLoaded", async () => {
  applyI18n();
  $("actions").prepend(langSelect());
  const PIL = [["learn", "#0067c8"], ["help", "#009739"], ["party", "#d41367"]];
  for (let i = 1; i <= 5; i++) $("qa").append(el("details", { name: "qa" }, el("summary", {}, t("ab_q" + i)), el("p", {}, t("ab_a" + i))));
  $("share").addEventListener("click", async () => { const data = { title: t("ab_title"), text: t("ab_lead"), url: location.href.split("?")[0] }; if (navigator.share) { try { await navigator.share(data); } catch {} } else { await navigator.clipboard.writeText(data.url); toast(t("copied")); } });
  await loadData();
  $("cta").append(ctaBlock());
  const pics = D.data.events.filter(e => e.image).slice(-9).map(e => e.image);
  const words = $("words");
  PIL.forEach(([k, col], i) => {
    const w = el("div", { class: "w", style: `--p:${col}` },
      el("div", { class: "word" }, t("ab_" + k) + "."),
      el("div", { class: "open" }, el("div", {}, el("div", { class: "pic" }, el("img", { src: pics[i * 2 + 1] || pics[i], alt: "", loading: "lazy", referrerpolicy: "no-referrer" })), el("p", {}, t("ab_" + k + "_t")))));
    words.append(w);
  });
  let cur = -1;
  const set = i => { if (i === cur) return; cur = i; [...words.children].forEach((w, k) => w.classList.toggle("on", k === i)); [...$("prog").children].forEach((d, k) => d.classList.toggle("on", k === i)); $("stage").style.setProperty("--p", PIL[i][1]); };
  const onScroll = () => { const tr = $("track"), r = tr.getBoundingClientRect(), range = tr.offsetHeight - innerHeight; const p = range > 0 ? Math.min(1, Math.max(0, -r.top / range)) : 1; set(Math.min(2, Math.floor(p * 3))); };
  addEventListener("scroll", onScroll, { passive: true }); addEventListener("resize", onScroll); onScroll();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) [...words.children].forEach(w => w.classList.add("on"));
});
</script>
</body>
</html>
