<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discover · Rotaract Events</title>
<meta name="description" content="Search every public Rotaract event in Switzerland and Liechtenstein: by club, district, place and date.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotaract">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
</head>
<body data-page="discover">
<a class="skip" href="#results" data-t="skip_to"></a>
<header>
  <div class="wrap bar">
    <a class="brand" href="./"><img src="rotaract.svg" alt="Rotaract"><span data-t="events">Events</span></a>
    <nav class="actions" id="actions"><a class="icon-btn" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span data-t="home"></span></a><a class="icon-btn" href="about.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span data-t="about"></span></a><button class="icon-btn" id="share" type="button" data-t-label="share"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span data-t="share"></span></button><button class="icon-btn" id="settingsBtn" type="button" data-t-label="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="settings"></span></button></nav>
  </div>
</header>
<div class="credits"><div class="wrap"><span data-t="credits"></span> · <a href="subscribe.html" data-t="subscribe">Subscribe</a> · <a href="https://github.com/Neyxo/rac-event-aggregation-tool" target="_blank" rel="noopener">GitHub</a></div></div>
<div class="banner" id="stale" role="status" hidden></div>

<main class="wrap">
  <h1 class="pagetitle" data-t="discover_title"></h1>
  <div class="filters">
    <div class="top">
      <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" data-t-ph="search_ph" data-t-label="search" autocomplete="off"></div>
      <button class="fbtn" id="fbtn" type="button" aria-expanded="false" aria-controls="panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span data-t="filters">Filters</span><span class="n" id="fcount" hidden></span></button>
    </div>
    <div class="row" id="views" role="group" data-t-label="filters">
      <button class="chip" type="button" data-view="all" data-t="v_all"></button>
      <button class="chip" type="button" data-view="week" data-t="v_week"></button>
      <button class="chip" type="button" data-view="weekend" data-t="v_weekend"></button>
      <button class="chip" type="button" data-view="near" data-t="v_near"></button>
      <button class="chip" type="button" data-view="saved" data-t="v_saved"></button>
      <button class="chip" type="button" data-view="past" data-t="v_past"></button>
    </div>
    <div class="panel" id="panel" hidden>
      <div class="row" id="districts" role="group" data-t-label="district"></div>
      <div class="row" id="clubs" role="group" data-t-label="clubs"></div>
      <div class="tools">
        <input type="text" id="place" data-t-ph="place_ph" data-t-label="place_ph" autocomplete="off">
        <button class="chip" type="button" id="locate" data-t-title="locate" data-t-label="locate">📍</button>
        <select id="radius" data-t-label="radius"><option value="" data-t="any_distance"></option><option value="10">10 km</option><option value="25">25 km</option><option value="50">50 km</option><option value="100">100 km</option></select>
        <div class="hint" id="placeHint" hidden></div>
      </div>
    </div>
  </div>
  <div class="summary"><span id="summary" aria-live="polite" data-t="loading"></span>
    <div class="r"><button type="button" class="clear" id="clear" hidden data-t="clear"></button>
      <div class="seg" role="group" data-t-label="layout"><button type="button" data-mode="list" aria-pressed="true" data-t="list"></button><button type="button" data-mode="month" aria-pressed="false" data-t="month"></button></div></div></div>
  <div id="results" aria-busy="true">
    <div class="skel" aria-hidden="true"><div class="b d"></div><div><div class="b t"></div><div class="b m"></div><div class="b m s"></div></div></div>
    <div class="skel" aria-hidden="true"><div class="b d"></div><div><div class="b t"></div><div class="b m"></div><div class="b m s"></div></div></div>
    <div class="skel" aria-hidden="true"><div class="b d"></div><div><div class="b t"></div><div class="b m"></div><div class="b m s"></div></div></div>
  </div>

  <section class="card about-teaser">
    <h2 data-t="ab_title"></h2>
    <p data-t="ab_lead"></p>
    <div class="links"><a class="primary" href="about.html" data-t="about"></a></div>
  </section>
  <footer id="footer"></footer>
</main>
<dialog class="ob" id="ob" aria-labelledby="obTitle"><div class="ob-in" id="obBody"></div></dialog>
<dialog class="ob" id="settingsDlg" aria-labelledby="setTitle"><div class="ob-in" id="setBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="app.js" defer></script>
</body>
</html>
