<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotaract Club</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
</head>
<body data-page="club">
<header id="top"></header>
<main class="wrap clubpage" id="main"></main>
<nav class="tabs-bar" id="tabs" aria-label="Main"></nav>
<div class="toast" id="toast" role="status"></div>
<script defer>
addEventListener("DOMContentLoaded", async () => {
  applyI18n(); chrome(null, { back: true });
  await loadData();
  const id = new URLSearchParams(location.search).get("id"), c = D.clubs[id], main = $("main");
  if (!c) { main.append(el("h1", {}, t("clubs")), ...D.data.clubs.map(x => el("p", {}, el("a", { href: "club.html?id=" + x.id }, x.name)))); return; }
  document.title = c.name + " · Rotaract Events";
  const upcoming = D.data.events.filter(e => e.clubs.includes(c.id) && !isPast(e)), next = upcoming[0];
  const https = new URL(c.id + ".ics", location.href).href, webcal = https.replace(/^https?:/, "webcal:");
  // subscribe, then website and socials as round icon buttons on the same line
  const ic = (name, href, label) => el("a", { class: "btn glass ic", href, target: "_blank", rel: "noopener", "aria-label": label, title: label }, icon(name));
  const btns = el("div", { class: "btns" }, ic("globe", c.url, t("cp_site")),
    ...Object.entries(c.links || {}).map(([k, href]) => ic(k, href, k[0].toUpperCase() + k.slice(1))));
  const photos = (c.photos && c.photos.length ? c.photos : D.data.events.filter(e => e.clubs.includes(c.id) && e.image && isPast(e)).slice(-6).map(e => e.image));
  const days = next ? Math.max(1, Math.round((new Date(next.start) - Date.now()) / 864e5)) : 0;
  main.style.cssText = clubStyle(c.id);
  wash(c.color, c.color, c.color);  // the club's colour wash behind frosted panes, like Home
  // two parts: a sticky header whose box is always 64px (its crest and name draw big over the block at rest and compact as you scroll),
  // and the colour block with the buttons, which simply scrolls away. No height ever changes while sticking, so nothing bounces.
  const head = el("div", { class: "cstick" }, c.logo ? el("img", { class: "c", src: c.logo, alt: "" }) : null,
    el("h1", {}, c.name), el("div", { class: "sub" }, [c.district ? t("d" + c.district) : t("national"), c.city].filter(Boolean).join(" · ")),
    el("a", { class: "go", href: webcal, title: t("cp_sub") }, icon("calendar"), el("span", {}, t("subscribe"))));
  const hero = el("div", { class: "chero" }, c.logo ? el("img", { class: "big", src: c.logo, alt: "" }) : null, btns);
  fill(main, head, hero,
    next ? nextUp(next) : el("p", { class: "meta", style: "margin-top:14px" }, t("cp_none")),
    c.news?.length ? el("h3", { class: "sh" }, t("news")) : null,
    c.news?.length ? newsStrip(c.news) : null,
    photos.length ? el("h3", { class: "sh" }, t("photos")) : null,
    photos.length ? el("div", { class: "strip pics" }, ...photos.map(src => el("img", { src, alt: "", loading: "lazy", referrerpolicy: "no-referrer" }))) : null,
    upcoming.length > 1 ? el("h3", { class: "sh" }, t("more_events")) : null,
    ...upcoming.slice(1, 8).map((e, i) => eventCard(e, i)),
    el("div", { class: "links", style: "justify-content:center" }, el("a", { href: "discover.html?clubs=" + c.id }, icon("discover"), t("cp_all"))),
    footer());
  // geometry at rest: the subscribe pill sits below the name (inside the sticky box, overflowing), the icon buttons in the block line up next to it
  morphHead(head);
  const bt = Math.round(head.querySelector(".sub").getBoundingClientRect().bottom - head.getBoundingClientRect().top + 12);
  head.style.setProperty("--bt", bt + "px"); hero.style.paddingTop = bt + "px"; const go = head.querySelector(".go"); btns.prepend(el("span", { class: "ph", style: `width:${go.offsetWidth}px;height:${go.offsetHeight}px` }));
  // the colour block drifts up a touch faster than the page: a subtle parallax that shows off the frosting
  const drift = () => { hero.style.transform = `translateY(${-(scrollY * .12).toFixed(1)}px)`; };
  addEventListener("scroll", drift, { passive: true }); drift();
});
</script>
</body>
</html>
