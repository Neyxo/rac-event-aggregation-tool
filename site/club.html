<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotaract Club</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="./"><img src="rotaract.svg" alt="Rotaract"><span data-t="events"></span></a>
    <div class="actions" id="actions"><a class="icon-btn" href="./" data-t="back"></a></div>
  </div>
</header>
<main class="wrap">
  <section class="card" id="hero"></section>
  <section class="card"><h2 data-t="cp_next"></h2><div id="next"></div></section>
  <section class="card" id="subs"><h2 data-t="cp_sub"></h2><div class="feeds" id="feeds"></div></section>
  <footer><span data-t="made_by"></span></footer>
</main>
<script>
const $ = id => document.getElementById(id);
applyI18n();
$("actions").prepend(langSelect());
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v); }
  for (const c of children) if (c != null && c !== false) n.append(c);
  return n;
}
function onColor(hex) { const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255); return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.5 ? "#1f1c26" : "#fff"; }
const fmtDay = new Intl.DateTimeFormat(LOCALE, { day: "numeric" }), fmtMon = new Intl.DateTimeFormat(LOCALE, { month: "short" });
const fmtWhen = new Intl.DateTimeFormat(LOCALE, { weekday: "short", hour: "2-digit", minute: "2-digit" }), fmtWeekday = new Intl.DateTimeFormat(LOCALE, { weekday: "long" });
(async () => {
  const data = await (await fetch("events.json", { cache: "no-cache" })).json();
  const id = new URLSearchParams(location.search).get("id"), c = data.clubs.find(c => c.id === id);
  if (!c) { // no or unknown club: list them all
    $("hero").append(el("h1", {}, t("clubs")), ...data.clubs.map(x => el("p", {}, el("a", { href: "club.html?id=" + x.id }, x.name))));
    $("next").parentElement.hidden = true; $("subs").hidden = true; return;
  }
  document.title = c.name + " · Rotaract Events";
  const style = `--c:${c.color};--on-c:${onColor(c.color)}`;
  $("hero").append(el("div", { class: "hero", style },
    c.logo ? el("img", { src: c.logo, alt: "" }) : null,
    el("div", {}, el("h1", {}, c.name), el("div", { class: "meta" }, c.district ? t("d" + c.district) : t("national")),
      el("div", { class: "links", style: "margin-top:8px" },
        el("a", { href: c.url, target: "_blank", rel: "noopener" }, t("cp_site")),
        el("a", { class: "primary", href: "./?clubs=" + c.id }, t("cp_all"))))));
  const now = new Date(), next = data.events.filter(e => e.clubs.includes(c.id) && new Date(e.end) >= now).slice(0, 8);
  if (!next.length) $("next").append(el("p", { class: "meta" }, t("cp_none")));
  for (const e of next) {
    const s = new Date(e.start);
    $("next").append(el("article", { class: "event", style },
      el("div", { class: "date", "aria-hidden": "true" }, el("b", {}, fmtDay.format(s)), el("span", {}, fmtMon.format(s))),
      el("div", { class: "body" }, el("h4", {}, el("a", { href: "./?event=" + e.id, style: "color:inherit;text-decoration:none" }, e.title)),
        el("div", { class: "meta" }, e.allday ? fmtWeekday.format(s) + " · " + t("all_day") : fmtWhen.format(s)), e.location ? el("div", { class: "meta where" }, e.location) : null),
      el("div", { class: "side" }, e.image ? el("img", { class: "thumb", src: e.image, alt: "", loading: "lazy", referrerpolicy: "no-referrer" }) : null)));
  }
  const https = new URL(c.id + ".ics", location.href).href, webcal = https.replace(/^https?:/, "webcal:");
  $("feeds").append(el("div", { class: "feed" }, el("div", { class: "name" }, c.name), el("div", { class: "l" },
    el("a", { href: webcal }, t("apple")), el("a", { href: "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(webcal), target: "_blank", rel: "noopener" }, t("google")), el("a", { href: https }, ".ics"))));
})();
</script>
</body>
</html>
