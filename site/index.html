<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotaract Events</title>
<meta name="description" content="All public Rotaract events in Switzerland and Liechtenstein: this week, near you, by club, as a list or a month calendar. Subscribe to a club's calendar.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotaract">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
</head>
<body>
<a class="skip" href="#results" data-t="skip_to">Skip to events</a>
<header>
  <div class="wrap bar">
    <a class="brand" href="./" id="brand"><img src="rotaract.svg" alt="Rotaract"><span data-t="events">Events</span></a>
    <div class="actions" id="actions">
      <a class="icon-btn" href="about.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span data-t="about"></span></a>
      <button class="icon-btn" id="share" type="button" data-t-label="share"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span data-t="share"></span></button>
      <button class="icon-btn" id="settingsBtn" type="button" data-t-label="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="settings"></span></button>
    </div>
  </div>
</header>
<div class="credits"><div class="wrap"><span data-t="credits"></span> · <a href="subscribe.html" data-t="subscribe">Subscribe</a> · <a href="https://github.com/Neyxo/rac-event-aggregation-tool" target="_blank" rel="noopener">GitHub</a></div></div>
<div class="banner" id="stale" role="status" hidden></div>

<main class="wrap">
  <div class="home" id="home" hidden></div>

  <div class="filters">
    <div class="top">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" data-t-ph="search_ph" data-t-label="search" autocomplete="off">
      </div>
      <button class="fbtn" id="fbtn" type="button" aria-expanded="false" aria-controls="panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span data-t="filters">Filters</span><span class="n" id="fcount" hidden></span></button>
    </div>
    <div class="row" id="views" role="group" data-t-label="filters">
      <div class="seg scope" id="scope" role="group" hidden>
        <button type="button" data-scope="mine" data-t="my_clubs"></button>
        <button type="button" data-scope="all" data-t="everything"></button>
      </div>
      <button class="chip" type="button" data-view="all" data-t="v_all"></button>
      <button class="chip" type="button" data-view="week" data-t="v_week"></button>
      <button class="chip" type="button" data-view="weekend" data-t="v_weekend"></button>
      <button class="chip" type="button" data-view="near" data-t="v_near"></button>
      <button class="chip" type="button" data-view="saved" data-t="v_saved"></button>
      <button class="chip" type="button" data-view="past" data-t="v_past"></button>
    </div>
    <div class="panel" id="panel" hidden>
      <div class="row" id="districts" role="group" data-t-label="district"></div>
      <div class="row" id="clubs" role="group" data-t-label="clubs"></div>
      <div class="tools">
        <input type="text" id="place" data-t-ph="place_ph" data-t-label="place_ph" autocomplete="off">
        <button class="chip" type="button" id="locate" data-t-title="locate" data-t-label="locate">📍</button>
        <select id="radius" data-t-label="radius">
          <option value="" data-t="any_distance"></option>
          <option value="10">10 km</option>
          <option value="25">25 km</option>
          <option value="50">50 km</option>
          <option value="100">100 km</option>
        </select>
        <div class="hint" id="placeHint" hidden></div>
      </div>
    </div>
  </div>

  <div class="summary"><span id="summary" aria-live="polite" data-t="loading"></span>
    <div class="r"><button type="button" class="clear" id="clear" hidden data-t="clear"></button>
      <div class="seg" role="group" data-t-label="layout">
        <button type="button" data-mode="list" aria-pressed="true" data-t="list"></button>
        <button type="button" data-mode="month" aria-pressed="false" data-t="month"></button>
      </div></div></div>
  <div id="results" aria-busy="true">
    <div class="skel" aria-hidden="true"><div class="b d"></div><div><div class="b t"></div><div class="b m"></div><div class="b m s"></div></div></div>
    <div class="skel" aria-hidden="true"><div class="b d"></div><div><div class="b t"></div><div class="b m"></div><div class="b m s"></div></div></div>
    <div class="skel" aria-hidden="true"><div class="b d"></div><div><div class="b t"></div><div class="b m"></div><div class="b m s"></div></div></div>
  </div>

  <section class="card" id="subscribe">
    <h2 data-t="sub_title"></h2>
    <p data-t="sub_text"></p>
    <div class="links"><a class="primary" href="subscribe.html" data-t="sub_cta"></a></div>
  </section>
  <section class="card about-teaser">
    <h2 data-t="ab_title"></h2>
    <p data-t="ab_lead"></p>
    <div class="links"><a class="primary" href="about.html" data-t="about"></a></div>
  </section>

  <footer id="footer"></footer>
</main>
<dialog class="ob" id="ob" aria-labelledby="obTitle"><div class="ob-in" id="obBody"></div></dialog>
<dialog class="ob" id="settingsDlg" aria-labelledby="setTitle"><div class="ob-in" id="setBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const SETTINGS_KEY = "rac.settings", SAVED_KEY = "rac.saved";
const DISTRICTS = { "1980": t("d1980"), "1990": t("d1990"), "2000": t("d2000") };
const state = { data: null, clubs: {}, view: "all", mode: "list", scope: "all", clubSel: new Set(), distSel: new Set(), center: null, centerLabel: "",
                saved: new Set(), open: new Set(), month: null, day: null, settings: { home: "", also: [] } };
applyI18n();

// --- helpers. Text only, never innerHTML: all event text comes from Polaris.
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null && c !== false) n.append(c);
  return n;
}
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let toastTimer;
function toast(msg, action) {
  const tt = $("toast");
  tt.replaceChildren(msg);
  if (action) { const b = el("button", { type: "button" }, action.label); b.addEventListener("click", action.fn); tt.append(b); }
  tt.classList.add("show"); clearTimeout(toastTimer);
  if (!action) toastTimer = setTimeout(() => tt.classList.remove("show"), 2200);
}
const fold = s => (s || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
function onColor(hex) { // white or dark text on a club colour
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.5 ? "#1f1c26" : "#fff";
}
function clubStyle(id) { const c = state.clubs[id]?.color || "#d41367"; return `--c:${c};--on-c:${onColor(c)}`; }
function clubMark(c) { return c.logo ? el("img", { src: c.logo, alt: "", loading: "lazy" }) : el("span", { class: "dot" }); }
function clubLabel(id) { const c = state.clubs[id]; return c ? c.name + (c.district ? ` (D${c.district})` : "") : id; }
function myClubs() { return [state.settings.home, ...state.settings.also].filter(id => state.clubs[id]); }
function km(a, b) {
  const rad = x => x * Math.PI / 180, dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
async function geocode(text) {
  const url = "https://api3.geo.admin.ch/rest/services/api/SearchServer?type=locations&sr=4326&limit=1&searchText=" + encodeURIComponent(text);
  const r = (await (await fetch(url)).json()).results?.[0];
  return r ? { coords: [r.attrs.lat, r.attrs.lon], label: r.attrs.label.replace(/<[^>]+>/g, "") } : null;
}
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
function setTheme(next) { store.set("rac.theme", next); document.documentElement.dataset.theme = next; }

// --- settings (the only thing that persists): main club + clubs you also follow
function saveSettings() { store.set(SETTINGS_KEY, state.settings); renderHome(); renderClubChips(); }
function renderHome() {
  const mine = myClubs(), box = $("home"), home = state.clubs[state.settings.home];
  $("scope").hidden = !mine.length;
  if (!mine.length || state.scope !== "mine") { box.hidden = true; return; }
  box.hidden = false;
  const lead = home || state.clubs[mine[0]];
  const change = el("button", { class: "ghost", type: "button" }, t("change"));
  change.addEventListener("click", openSettings);
  box.replaceChildren(el("div", { class: "home-in", style: clubStyle(lead.id) },
    lead.logo ? el("img", { class: "crest", src: lead.logo, alt: "" }) : null,
    el("div", { class: "ht" },
      el("div", { class: "meta" }, t("home_banner")),
      el("h2", {}, el("a", { href: "club.html?id=" + lead.id }, lead.name)),
      mine.length > 1 ? el("div", { class: "also" }, ...mine.slice(1).map(id => { const c = state.clubs[id]; return el("a", { class: "mini", href: "club.html?id=" + id, title: c.name, style: clubStyle(id) }, clubMark(c), c.short); })) : null),
    change));
}
function clubPicker(selected, onPick, { single = false, exclude = [] } = {}) {
  const chips = el("div", { class: "chips" });
  if (single) {
    const none = el("button", { class: "chip", type: "button", "aria-pressed": String(!selected) }, t("none"));
    none.addEventListener("click", () => onPick(""));
    chips.append(none);
  }
  for (const c of state.data.clubs) {
    if (exclude.includes(c.id)) continue;
    const on = single ? selected === c.id : selected.has(c.id);
    const b = el("button", { class: "chip club", type: "button", style: clubStyle(c.id), "aria-pressed": String(on), "aria-label": c.name, role: single ? "radio" : undefined }, clubMark(c), c.short);
    b.addEventListener("click", () => onPick(c.id));
    chips.append(b);
  }
  return chips;
}
function openSettings() {
  const dlg = $("settingsDlg"), body = $("setBody");
  const draw = () => {
    const s = state.settings;
    body.replaceChildren(
      el("h2", { id: "setTitle", tabindex: "-1" }, t("settings")),
      el("p", {}, t("set_hint")),
      el("h3", {}, t("main_club")),
      clubPicker(s.home, id => { s.home = id; s.also = s.also.filter(x => x !== id); saveSettings(); draw(); }, { single: true }),
      el("h3", {}, t("also_show")),
      clubPicker(new Set(s.also), id => { s.also = s.also.includes(id) ? s.also.filter(x => x !== id) : [...s.also, id]; saveSettings(); draw(); }, { exclude: [s.home] }),
      el("h3", {}, t("language")), langSelect(),
      el("h3", {}, t("appearance")),
      el("div", { class: "chips" }, ...[["light", t("theme_light")], ["dark", t("theme_dark")]].map(([k, name]) => {
        const b = el("button", { class: "chip", type: "button", "aria-pressed": String(document.documentElement.dataset.theme === k) }, name);
        b.addEventListener("click", () => { setTheme(k); draw(); }); return b;
      })),
      el("h3", {}, t("inst_title")), installBlock(),
      el("h3", {}, t("share_title")), el("p", { class: "meta" }, t("share_text")),
      (() => { const box = el("div", { class: "linkbox" }, el("input", { type: "text", readonly: "", value: location.origin + location.pathname, "aria-label": t("share_title") }), el("button", { type: "button" }, t("copy")));
        box.lastChild.addEventListener("click", async () => { await navigator.clipboard.writeText(box.firstChild.value); toast(t("copied")); }); return box; })(),
      el("div", { class: "links", style: "margin-top:14px" },
        (() => { const b = el("button", { class: "linkbtn", type: "button" }, t("rerun")); b.addEventListener("click", () => { dlg.close(); onboarding(); }); return b; })(),
        el("a", { href: "about.html" }, t("about"))),
      (() => { const n = el("div", { class: "nav" }, el("span"), el("button", { class: "btn", type: "button" }, t("done"))); n.lastChild.addEventListener("click", () => dlg.close()); return n; })());
  };
  draw();
  dlg.showModal(); $("setTitle").focus();
  dlg.addEventListener("close", () => { if (state.scope === "mine" && !myClubs().length) setScope("all"); else render(); }, { once: true });
}

// --- location
function hint(text) { $("placeHint").textContent = text; $("placeHint").hidden = !text; }
async function setPlace(text) {
  hint(""); state.center = null;
  if (text.trim()) {
    try {
      const hit = await geocode(text);
      if (hit) { state.center = hit.coords; state.centerLabel = hit.label; hint("📍 " + hit.label); }
      else hint(t("place_nf"));
    } catch { hint(t("place_err")); }
  }
  if (state.center && !$("radius").value) $("radius").value = "25";
  render();
}
function locateMe() {
  if (!navigator.geolocation) { toast(t("loc_none")); return; }
  hint(t("locating"));
  navigator.geolocation.getCurrentPosition(pos => {
    state.center = [pos.coords.latitude, pos.coords.longitude]; state.centerLabel = t("you");
    $("place").value = ""; hint(t("your_location"));
    if (!$("radius").value) $("radius").value = "25";
    render();
  }, () => { hint(t("loc_na")); if (state.view === "near") setView("all"); });
}

// --- views, scope & modes
function setView(v) {
  state.view = v;
  for (const b of $("views").querySelectorAll(".chip")) b.setAttribute("aria-pressed", String(b.dataset.view === v));
  if (v === "near" && !state.center) locateMe(); else render();
}
function setScope(s) {
  state.scope = myClubs().length ? s : "all";
  for (const b of $("scope").children) b.setAttribute("aria-pressed", String(b.dataset.scope === state.scope));
  state.clubSel.clear(); state.distSel.clear();
  renderHome(); renderClubChips(); render();
}
function setMode(m) {
  state.mode = m;
  for (const b of document.querySelectorAll(".summary .seg button")) b.setAttribute("aria-pressed", String(b.dataset.mode === m));
  for (const b of $("views").querySelectorAll(".chip")) b.style.display = m === "month" ? "none" : "";
  render();
}
function toggleIn(set, id) { set.has(id) ? set.delete(id) : set.add(id); renderClubChips(); render(); }
function renderClubChips() {
  const mine = state.scope === "mine" ? myClubs() : null;
  const drow = $("districts");
  drow.replaceChildren(el("span", { class: "rowlabel" }, t("district")));
  drow.hidden = !!mine;
  const dall = el("button", { class: "chip district", type: "button", "aria-pressed": String(state.distSel.size === 0) }, t("all"));
  dall.addEventListener("click", () => { state.distSel.clear(); renderClubChips(); render(); });
  drow.append(dall);
  for (const [d, name] of Object.entries(DISTRICTS)) {
    const b = el("button", { class: "chip district", type: "button", "aria-pressed": String(state.distSel.has(d)), title: name }, name);
    b.addEventListener("click", () => toggleIn(state.distSel, d));
    drow.append(b);
  }
  const row = $("clubs");
  row.replaceChildren(el("span", { class: "rowlabel" }, t("clubs")));
  const all = el("button", { class: "chip", type: "button", "aria-pressed": String(state.clubSel.size === 0) }, t("all"));
  all.addEventListener("click", () => { state.clubSel.clear(); renderClubChips(); render(); });
  row.append(all);
  for (const c of state.data.clubs) {
    if (mine && !mine.includes(c.id)) continue;
    if (state.distSel.size && !state.distSel.has(c.district)) continue;
    const b = el("button", { class: "chip club", type: "button", style: clubStyle(c.id), "aria-pressed": String(state.clubSel.has(c.id)), "aria-label": c.name }, clubMark(c), c.short);
    b.addEventListener("click", () => toggleIn(state.clubSel, c.id));
    row.append(b);
  }
  const n = state.distSel.size + (state.clubSel.size ? 1 : 0) + ($("place").value ? 1 : 0) + ($("radius").value ? 1 : 0);
  $("fcount").textContent = n; $("fcount").hidden = !n;
}
function togglePanel(open) {
  const o = open ?? $("panel").hidden;
  $("panel").hidden = !o; $("fbtn").setAttribute("aria-expanded", String(o));
}
function weekendRange(now) {
  const sat = startOfDay(now); sat.setDate(sat.getDate() + ((6 - sat.getDay()) % 7));
  if (now.getDay() === 0) sat.setDate(sat.getDate() - 7);
  const end = new Date(sat); end.setDate(end.getDate() + 2);
  return [sat, end];
}

// --- filtering (shared by list and month)
function baseMatches(e) {
  const q = fold($("q").value.trim());
  if (state.scope === "mine") { const mine = myClubs(); if (mine.length && !e.clubs.some(c => mine.includes(c))) return false; }
  if (state.distSel.size && !e.clubs.some(c => state.distSel.has(state.clubs[c]?.district))) return false;
  if (state.clubSel.size && !e.clubs.some(c => state.clubSel.has(c))) return false;
  if (q) {
    const hay = fold([e.title, e.description, e.location, ...e.clubs.map(c => state.clubs[c]?.name || c)].join(" "));
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
function distanceOf(e) { return state.center && e.coords ? km(state.center, e.coords) : null; }
function withinRadius(e) {
  const radius = Number($("radius").value) || null, use = state.center && (radius || state.view === "near");
  if (!use) return true;
  if (!e.coords) return false;
  return distanceOf(e) <= (radius || 25);
}

// --- cards
const fmtDay = new Intl.DateTimeFormat(LOCALE, { day: "numeric" });
const fmtMon = new Intl.DateTimeFormat(LOCALE, { month: "short" });
const fmtMonth = new Intl.DateTimeFormat(LOCALE, { month: "long", year: "numeric" });
const fmtWhen = new Intl.DateTimeFormat(LOCALE, { weekday: "short", hour: "2-digit", minute: "2-digit" });
const fmtTime = new Intl.DateTimeFormat(LOCALE, { hour: "2-digit", minute: "2-digit" });
const fmtWeekday = new Intl.DateTimeFormat(LOCALE, { weekday: "long" });
const fmtFull = new Intl.DateTimeFormat(LOCALE, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const fmtStamp = new Intl.DateTimeFormat(LOCALE, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const starSvg = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", "m12 3 2.8 5.9 6.4.8-4.7 4.5 1.2 6.4L12 17.5l-5.7 3.1 1.2-6.4L2.8 9.7l6.4-.8z"); s.append(p); return s; };

async function shareEvent(e) {
  const url = new URL(`e/${e.id}.html`, location.href).href;
  const data = { title: e.title, text: `${e.title} · ${fmtFull.format(new Date(e.start))}${e.location ? " · " + e.location : ""}`, url };
  if (navigator.share) { try { await navigator.share(data); } catch {} }
  else { await navigator.clipboard.writeText(url); toast(t("copied")); }
}

function card(e, i = 0) {
  const start = new Date(e.start), end = new Date(e.end), dist = distanceOf(e), open = state.open.has(e.id), lead = state.clubs[e.clubs[0]] || {};
  const when = e.allday ? fmtWeekday.format(start) + " · " + t("all_day") : fmtWhen.format(start) + (sameDay(start, end) ? "–" + fmtTime.format(end) : "");
  const where = [e.location, dist != null ? Math.round(dist) + " km" : null].filter(Boolean).join(" · ");
  const star = el("button", { class: "star", type: "button", "aria-pressed": String(state.saved.has(e.id)), "aria-label": t("save") + ": " + e.title }, starSvg());
  star.addEventListener("click", ev => {
    ev.stopPropagation();
    state.saved.has(e.id) ? state.saved.delete(e.id) : state.saved.add(e.id);
    store.set(SAVED_KEY, [...state.saved]);
    star.setAttribute("aria-pressed", String(state.saved.has(e.id)));
    toast(state.saved.has(e.id) ? t("saved") : t("unsaved"));
    if (state.view === "saved") render();
  });
  const title = el("button", { type: "button", "aria-expanded": String(open) }, e.title);
  const art = el("article", { class: "event" + (e.cancelled ? " cancelled" : "") + (open ? " open" : ""), style: clubStyle(e.clubs[0]) + `;--i:${Math.min(i, 12)}`, id: "ev-" + e.id },
    lead.logo ? el("img", { class: "wm", src: lead.logo, alt: "", "aria-hidden": "true", loading: "lazy" }) : null,
    el("div", { class: "date", "aria-hidden": "true" }, el("b", {}, fmtDay.format(start)), el("span", {}, fmtMon.format(start))),
    el("div", { class: "body" },
      el("h4", {}, e.cancelled ? el("span", { class: "badge" }, t("cancelled")) : null, title),
      el("div", { class: "meta" }, when),
      where ? el("div", { class: "meta where", title: where }, where) : null,
      el("div", { class: "tags" }, ...e.clubs.map(c => el("span", { class: "tag", style: clubStyle(c) }, clubMark(state.clubs[c] || {}), state.clubs[c]?.short || c)))),
    el("div", { class: "side" },
      e.image && !open ? el("img", { class: "thumb", src: e.image, alt: "", loading: "lazy", referrerpolicy: "no-referrer" }) : null,
      star));
  if (open) {
    const shareBtn = el("button", { type: "button", class: "linkbtn" }, t("share_event"));
    shareBtn.addEventListener("click", () => shareEvent(e));
    art.append(el("div", { class: "detail" },
      e.image ? el("img", { src: e.image, alt: "", referrerpolicy: "no-referrer" }) : null,
      el("p", {}, e.description || t("no_desc")),
      el("dl", { class: "kv" },
        el("dt", {}, t("when")), el("dd", {}, fmtFull.format(start) + (e.allday ? "" : ", " + fmtTime.format(start) + (sameDay(start, end) ? "–" + fmtTime.format(end) : ""))),
        e.location ? el("dt", {}, t("where")) : null, e.location ? el("dd", {}, e.location) : null,
        e.registration ? el("dt", {}, t("registration")) : null, e.registration ? el("dd", {}, e.registration) : null,
        el("dt", {}, t("club")), el("dd", {}, ...e.clubs.flatMap((c, i) => [i ? " & " : null, el("a", { href: "club.html?id=" + c }, clubLabel(c))]))),
      el("div", { class: "links" },
        el("a", { class: "primary", href: e.url, target: "_blank", rel: "noopener" }, t("register")),
        el("a", { href: e.url.replace("/agenda/show/", "/agenda/ical/") }, t("add_cal")),
        shareBtn)));
  }
  const toggle = () => { open ? state.open.delete(e.id) : state.open.add(e.id); const n = card(e, 0); n.style.setProperty("--i", "0"); n.classList.add("still"); art.replaceWith(n); };
  title.addEventListener("click", toggle);
  art.addEventListener("click", ev => { if (!ev.target.closest("a, button, .detail")) toggle(); });
  return art;
}

function list(events, byMonth = true) {
  const frag = document.createDocumentFragment();
  let month = "", i = 0;
  for (const e of events) {
    const m = fmtMonth.format(new Date(e.start));
    if (byMonth && m !== month) { frag.append(el("h3", {}, m)); month = m; }
    frag.append(card(e, i++));
  }
  return frag;
}

// --- list mode
function renderList(out) {
  const now = new Date(), in7 = new Date(now.getTime() + 7 * 864e5), [wkStart, wkEnd] = weekendRange(now);
  let noLocation = 0;
  const matches = [];
  for (const e of state.data.events) {
    const start = new Date(e.start), past = new Date(e.end) < now;
    if (state.view === "past" ? !past : past) continue;
    if (state.view === "week" && start > in7) continue;
    if (state.view === "weekend" && (start < wkStart || start >= wkEnd)) continue;
    if (state.view === "saved" && !state.saved.has(e.id)) continue;
    if (!baseMatches(e)) continue;
    if (!withinRadius(e)) { if (!e.coords) noLocation++; continue; }
    matches.push(e);
  }
  if (state.view === "past") matches.reverse();
  const n = matches.length;
  const parts = [t("s_" + state.view, { n: nEvents(n) })];
  const radius = Number($("radius").value) || (state.view === "near" ? 25 : null);
  if (state.center && radius) parts.push(t("within", { r: radius, place: state.centerLabel }));
  if (noLocation) parts.push(t("no_location", { n: noLocation }));
  $("summary").textContent = parts.join(" · ");
  if (!n) {
    const btn = el("button", { type: "button" }, t("show_all"));
    btn.addEventListener("click", clearFilters);
    out.append(el("div", { class: "empty" }, state.view === "saved" ? t("empty_saved") : t("empty"), el("br"), btn));
  }
  out.append(list(matches));
}

// --- month mode
function renderMonth(out) {
  const now = new Date();
  if (!state.month) state.month = new Date(now.getFullYear(), now.getMonth(), 1);
  const m = state.month, first = new Date(m), last = new Date(m.getFullYear(), m.getMonth() + 1, 0);
  const lead = (first.getDay() + 6) % 7; // Monday first
  const gridStart = new Date(first); gridStart.setDate(1 - lead);
  const events = state.data.events.filter(e => baseMatches(e) && withinRadius(e));
  const byDay = {};
  for (const e of events) {
    const s = startOfDay(new Date(e.start)), end = new Date(e.end);
    for (let d = new Date(s); d < end || sameDay(d, s); d.setDate(d.getDate() + 1)) {
      if (d < gridStart || d > new Date(last.getTime() + 7 * 864e5)) continue;
      (byDay[d.toDateString()] ||= []).push(e);
      if (e.allday && d >= end) break;
    }
  }
  const inMonth = events.filter(e => { const s = new Date(e.start); return s >= first && s <= new Date(last.getTime() + 864e5); });
  $("summary").textContent = t("s_month", { n: nEvents(inMonth.length), m: fmtMonth.format(m) });

  const prev = el("button", { type: "button", "aria-label": t("prev_month") }, "‹"), next = el("button", { type: "button", "aria-label": t("next_month") }, "›");
  prev.addEventListener("click", () => { state.month = new Date(m.getFullYear(), m.getMonth() - 1, 1); state.day = null; render(); });
  next.addEventListener("click", () => { state.month = new Date(m.getFullYear(), m.getMonth() + 1, 1); state.day = null; render(); });
  const today = el("button", { type: "button" }, t("today"));
  today.addEventListener("click", () => { state.month = new Date(now.getFullYear(), now.getMonth(), 1); state.day = startOfDay(now); render(); });
  const grid = el("div", { class: "grid", role: "grid" }, ...t("dow").map(d => el("div", { class: "dow", role: "columnheader" }, d)));
  const cells = lead + last.getDate() > 35 ? 42 : 35;
  for (let i = 0; i < cells; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    const evs = byDay[d.toDateString()] || [];
    const cell = el("button", { type: "button", class: "day" + (d.getMonth() !== m.getMonth() ? " other" : "") + (sameDay(d, now) ? " today" : ""),
      "aria-pressed": String(state.day && sameDay(d, state.day)), "aria-label": fmtFull.format(d) + ", " + t("n_on_day", { n: evs.length }) },
      el("span", { class: "n" }, d.getDate()),
      ...evs.slice(0, 3).map(e => el("span", { class: "pill", style: clubStyle(e.clubs[0]), title: e.title }, e.title)),
      evs.length > 3 ? el("span", { class: "more" }, `+${evs.length - 3}`) : null);
    cell.addEventListener("click", () => { state.day = state.day && sameDay(d, state.day) ? null : d; render(); });
    grid.append(cell);
  }
  out.append(el("div", { class: "month" }, el("div", { class: "mhead" }, prev, el("h2", {}, fmtMonth.format(m)), el("div", {}, today, " ", next)), grid));
  const shown = state.day ? (byDay[state.day.toDateString()] || []) : inMonth;
  const dl = el("div", { class: "daylist" }, el("h3", {}, state.day ? fmtFull.format(state.day) : t("all_in", { m: fmtMonth.format(m) })));
  dl.append(shown.length ? list(shown, false) : el("p", { class: "meta" }, t("no_day")));
  out.append(dl);
}

function render() {
  if (!state.data) return;
  const out = $("results");
  out.replaceChildren(); out.removeAttribute("aria-busy");
  state.mode === "month" ? renderMonth(out) : renderList(out);
  $("clear").hidden = !($("q").value || state.clubSel.size || state.distSel.size || $("place").value || $("radius").value || state.view !== "all" || state.mode !== "list");
  syncUrl();
}

// --- the URL mirrors the current filters so a view can be shared; nothing here is remembered
function syncUrl() {
  const p = new URLSearchParams();
  if ($("q").value) p.set("q", $("q").value);
  if (state.scope === "all" && myClubs().length) p.set("scope", "all");
  if (state.distSel.size) p.set("d", [...state.distSel].join(","));
  if (state.clubSel.size) p.set("clubs", [...state.clubSel].join(","));
  if ($("place").value) p.set("place", $("place").value);
  if ($("radius").value) p.set("r", $("radius").value);
  if (state.view !== "all") p.set("view", state.view);
  if (state.mode !== "list") p.set("mode", state.mode);
  history.replaceState(null, "", p.toString() ? "?" + p : location.pathname);
}
function clearFilters() {
  $("q").value = ""; $("place").value = ""; $("radius").value = ""; hint("");
  state.center = null; state.clubSel.clear(); state.distSel.clear(); state.day = null; state.month = null;
  renderClubChips(); setMode("list"); setView("all");
}
function goHome(ev) {
  ev?.preventDefault();
  clearFilters(); setScope("mine"); togglePanel(false);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// --- subscribe + install
function feedRow(c, file, count) {
  const https = new URL(file, location.href).href, webcal = https.replace(/^https?:/, "webcal:");
  return el("div", { class: "feed" },
    el("div", { class: "name", style: c.id ? clubStyle(c.id) : "" }, c.id ? clubMark(c) : null, c.name, count != null ? el("span", { class: "meta" }, t("n_upcoming", { n: count })) : null),
    el("div", { class: "l" },
      el("a", { href: webcal }, t("apple")),
      el("a", { href: "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(webcal), target: "_blank", rel: "noopener" }, t("google")),
      el("a", { href: https }, ".ics")));
}
let installPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; });
window.addEventListener("appinstalled", () => { installPrompt = null; toast("🎉"); });
function installBlock() {
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) return el("p", { class: "meta" }, t("inst_done"));
  if (installPrompt) {
    const b = el("button", { class: "install-btn", type: "button" }, t("inst_btn"));
    b.addEventListener("click", async () => { installPrompt.prompt(); await installPrompt.userChoice; });
    return b;
  }
  return installGuide();
}
function installGuide() {
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const tabs = el("div", { class: "tabs", role: "tablist" }), steps = el("ol", { class: "steps" });
  const show = key => { for (const b of tabs.children) b.setAttribute("aria-selected", String(b.dataset.key === key)); steps.replaceChildren(...t("g_" + key).map(s => el("li", {}, s))); };
  for (const key of ["ios", "android", "desktop"]) {
    const b = el("button", { type: "button", role: "tab", "data-key": key }, t(key));
    b.addEventListener("click", () => show(key));
    tabs.append(b);
  }
  show(ios ? "ios" : /Android/.test(ua) ? "android" : "desktop");
  return el("div", {}, tabs, steps);
}

// --- onboarding (first visit): main club + others pre-selected from a rough location guess, then subscribe, then install
async function guessClubs() {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 3500);
    const opts = { signal: ctl.signal };
    // Approximate location of the connection, no permission prompt. Nothing is stored.
    let r = await fetch("https://get.geojs.io/v1/ip/geo.json", opts).then(r => r.json()).catch(() => null);
    if (!r?.latitude) r = await fetch("https://ipwho.is/", opts).then(r => r.json()).catch(() => null);
    const here = [Number(r?.latitude), Number(r?.longitude)];
    if (here[0] && ["CH", "LI"].includes(r.country_code)) {
      const near = state.data.clubs.filter(c => c.coords).map(c => ({ id: c.id, d: km(here, c.coords) })).filter(x => x.d <= 35).sort((a, b) => a.d - b.d);
      if (near.length) return near.slice(0, 2).map(x => x.id);
    }
  } catch {}
  return { fr: ["fribourg", "geneve-international"], it: ["ticino"], en: ["zurich-international", "geneve-international"] }[LANG] || [];
}
async function onboarding() {
  const dlg = $("ob"), body = $("obBody"), guess = await guessClubs();
  const s = { home: guess[0] || "", also: guess.slice(1) };
  let step = 0;
  const finish = () => {
    state.settings = s; store.set(SETTINGS_KEY, s); store.set("rac.onboarded", true);
    dlg.close(); saveSettings(); setScope("mine");
    if (myClubs().length) toast(t("ob_showing", { clubs: myClubs().map(id => state.clubs[id]?.short).join(", ") }));
  };
  const draw = () => {
    body.replaceChildren(el("div", { class: "bar2", "aria-hidden": "true" }, ...[0, 1, 2].map(i => el("i", { class: i <= step ? "on" : "" }))));
    const nav = (nextLabel, skip) => el("div", { class: "nav" }, skip ? el("button", { class: "skip", type: "button" }, skip) : el("span"), el("button", { class: "btn", type: "button" }, nextLabel));
    const h2 = el("h2", { id: "obTitle", tabindex: "-1" });
    if (step === 0) {
      const n = nav(t("next"), t("skip"));
      n.lastChild.addEventListener("click", () => { step = 1; draw(); });
      n.firstChild.addEventListener("click", finish);
      h2.textContent = t("ob_welcome");
      body.append(h2, el("p", {}, t("ob_q") + " " + (s.home ? t("ob_pre") : t("ob_pick"))),
        el("h3", {}, t("ob_main")), clubPicker(s.home, id => { s.home = id; s.also = s.also.filter(x => x !== id); draw(); }, { single: true }),
        el("h3", {}, t("ob_also")), clubPicker(new Set(s.also), id => { s.also = s.also.includes(id) ? s.also.filter(x => x !== id) : [...s.also, id]; draw(); }, { exclude: [s.home] }),
        n);
    } else if (step === 1) {
      const ids = [s.home, ...s.also].filter(id => state.clubs[id]);
      const feeds = el("div", { class: "feeds" }, ...ids.map(id => feedRow(state.clubs[id], id + ".ics", null)),
        ids.length ? el("p", { class: "meta", style: "margin:4px 0 0" }, t("ob_or")) : null,
        feedRow({ name: t("all_feed") }, "all.ics", null),
        el("p", { class: "meta", style: "margin:6px 0 0" }, t("ob_help"), el("a", { href: "subscribe.html", target: "_blank" }, t("ob_help_link"))));
      const n = nav(t("next"), t("not_now"));
      n.lastChild.addEventListener("click", () => { step = 2; draw(); });
      n.firstChild.addEventListener("click", () => { step = 2; draw(); });
      h2.textContent = t("ob_sub");
      body.append(h2, el("p", {}, t("ob_sub_text")), feeds, n);
    } else {
      const n = nav(t("done"), installPrompt ? t("not_now") : null);
      n.lastChild.addEventListener("click", finish);
      if (installPrompt) n.firstChild.addEventListener("click", finish);
      h2.textContent = t("ob_inst");
      body.append(h2, el("p", {}, t("ob_inst_text")), installBlock(), n, el("div", { class: "credit" }, t("credit_short")));
    }
    h2.focus();
  };
  draw();
  dlg.addEventListener("cancel", ev => { ev.preventDefault(); finish(); }, { once: true });
  dlg.showModal();
  $("obTitle").focus();
}
async function share() {
  const url = new URL(location.href); url.hash = "";
  const data = { title: "Rotaract Events", text: t("share_app"), url: url.href };
  if (navigator.share) { try { await navigator.share(data); } catch {} }
  else { await navigator.clipboard.writeText(url.href); toast(t("copied")); }
}

// --- service worker: register, and offer a refresh when a newer app shell was fetched in the background
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", ev => {
    if (ev.data?.type === "updated") toast(t("new_version"), { label: t("refresh"), fn: () => location.reload() });
  });
}

// --- boot
async function init() {
  $("share").addEventListener("click", share);
  $("settingsBtn").addEventListener("click", openSettings);
  $("brand").addEventListener("click", goHome);

  try { state.data = await (await fetch("events.json", { cache: "no-cache" })).json(); }
  catch { $("summary").textContent = t("offline"); $("results").replaceChildren(); return; }
  state.saved = new Set(store.get(SAVED_KEY, []));
  for (const c of state.data.clubs) state.clubs[c.id] = c;
  // settings; migrate the old "clubs" preference once
  const old = store.get("rac.prefs", null);
  state.settings = store.get(SETTINGS_KEY, old?.clubs?.length ? { home: old.clubs[0], also: old.clubs.slice(1) } : { home: "", also: [] });
  state.settings.also = (state.settings.also || []).filter(id => state.clubs[id] && id !== state.settings.home);
  if (!state.clubs[state.settings.home]) state.settings.home = "";
  if (old) { localStorage.removeItem("rac.prefs"); store.set(SETTINGS_KEY, state.settings); }

  const generated = new Date(state.data.generated);
  if (Date.now() - generated > 30 * 3600e3) { $("stale").textContent = t("stale", { t: fmtStamp.format(generated) }); $("stale").hidden = false; }
  $("footer").replaceChildren(t("updated", { t: fmtStamp.format(generated) }) + " · " + t("members_only"), el("br"),
    t("made_by") + " · ", el("a", { href: "https://github.com/Neyxo/rac-event-aggregation-tool", target: "_blank", rel: "noopener" }, t("source")));

  const p = new URLSearchParams(location.search), eventId = p.get("event");
  p.delete("lang"); p.delete("event");
  const shared = [...p.keys()].length > 0 || !!eventId;
  $("q").value = p.get("q") || "";
  $("radius").value = p.get("r") || "";
  $("place").value = p.get("place") || "";
  state.clubSel = new Set((p.get("clubs") || "").split(",").filter(c => state.clubs[c]));
  state.distSel = new Set((p.get("d") || "").split(",").filter(d => DISTRICTS[d]));
  state.scope = myClubs().length && !(shared || p.get("scope") === "all") ? "mine" : "all";
  for (const b of $("scope").children) b.setAttribute("aria-pressed", String(b.dataset.scope === state.scope));
  renderHome(); renderClubChips();

  $("fbtn").addEventListener("click", () => togglePanel());
  let timer;
  $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 150); });
  $("radius").addEventListener("change", () => { renderClubChips(); render(); });
  $("place").addEventListener("change", () => { renderClubChips(); setPlace($("place").value); });
  $("place").addEventListener("keydown", ev => { if (ev.key === "Enter") $("place").blur(); });
  $("locate").addEventListener("click", locateMe);
  $("clear").addEventListener("click", clearFilters);
  for (const b of $("views").querySelectorAll(".chip")) b.addEventListener("click", () => setView(b.dataset.view));
  for (const b of $("scope").children) b.addEventListener("click", () => setScope(b.dataset.scope));
  for (const b of document.querySelectorAll(".summary .seg button")) b.addEventListener("click", () => setMode(b.dataset.mode));

  if ($("place").value) await setPlace($("place").value);
  state.view = p.get("view") || "all";
  // A shared event link opens that event, in the Past view if it's over.
  const target = eventId && state.data.events.find(e => e.id === eventId);
  if (target) { state.open.add(eventId); state.view = new Date(target.end) < new Date() ? "past" : "all"; }
  for (const b of $("views").querySelectorAll(".chip")) b.setAttribute("aria-pressed", String(b.dataset.view === state.view));
  setMode(p.get("mode") === "month" ? "month" : "list");
  if (target) $("ev-" + eventId)?.scrollIntoView({ block: "start" });
  if (state.view === "near" && !state.center) locateMe();
  if (!shared && !store.get("rac.onboarded", false)) onboarding();
}
init();
