<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subscribe · Rotaract Events</title>
<meta name="description" content="Subscribe to Rotaract event calendars for Switzerland and Liechtenstein: per club or all clubs, for Apple, Google and Outlook calendars.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
</head>
<body data-page="subscribe">
<header id="top"></header>
<main class="wrap" id="main">
  <section class="card">
    <h2 data-t="sub_title"></h2>
    <p data-t="sp_intro"></p>
    <div class="how" id="how"></div>
  </section>
  <section class="card" id="all">
    <h2 data-t="sp_all"></h2>
    <p data-t="sp_all_text"></p>
    <div class="feeds" id="feedAll"></div>
  </section>
  <section class="card">
    <h2 data-t="sp_club"></h2>
    <p data-t="sp_club_text"></p>
    <div class="feeds" id="feeds"></div>
  </section>
  <section class="card">
    <h2 data-t="faq"></h2>
    <div class="qa" id="qa"></div>
  </section>
  <div id="foot"></div>
</main>
<nav class="tabs-bar" id="tabs" aria-label="Main"></nav>
<div class="toast" id="toast" role="status"></div>
<script defer>
addEventListener("DOMContentLoaded", async () => {
  applyI18n(); chrome(null, { back: true });
  const DISTRICTS = { "1980": t("d1980"), "1990": t("d1990"), "2000": t("d2000"), "": t("national") };
  const feedRow = (c, file, count) => {
    const https = new URL(file, location.href).href, webcal = https.replace(/^https?:/, "webcal:");
    return el("div", { class: "feed" },
      el("div", { class: "name", style: c.id ? clubStyle(c.id) : "" }, c.id ? clubMark(c) : null, c.id ? el("a", { href: "club.html?id=" + c.id }, c.name) : c.name, count != null ? el("span", { class: "meta" }, t("n_upcoming", { n: count })) : null),
      el("div", { class: "l" }, el("a", { href: webcal }, t("apple")), googleLink(webcal), el("a", { href: https }, ".ics")));
  };
  for (const k of ["ios", "google", "android", "outlook"]) $("how").append(el("details", {}, el("summary", {}, t("sp_" + k)), el("ol", {}, ...t("sp_" + k + "_s").map(s => el("li", {}, s)))));
  $("qa").append(...qaList(t("sub_qa")));
  await loadData();
  const now = new Date(), upcomingBy = {}; let total = 0;
  for (const e of D.data.events) if (new Date(e.end) >= now) { if (e.layer !== "rotary") total++; for (const c of e.clubs) upcomingBy[c] = (upcomingBy[c] || 0) + 1; }
  $("feedAll").append(feedRow({ name: t("sp_all_feed") }, "all.ics", total));
  for (const [d, name] of Object.entries(DISTRICTS)) {
    const cs = D.data.clubs.filter(c => c.district === d && !c.source).sort((a, b) => a.name.localeCompare(b.name));
    if (cs.length) $("feeds").append(el("h3", {}, name), ...cs.map(c => feedRow(c, c.id + ".ics", upcomingBy[c.id] || 0)));
  }
  // the pseudo-clubs under their own headings: international, and the Rotary layer's feeds, one per district (only there when "Show Rotary events" is on)
  for (const [source, name] of [["international", t("intl").h], ["rotary", t("rotary_feeds")]]) {
    const cs = D.data.clubs.filter(c => c.source === source);
    if (cs.length) $("feeds").append(el("h3", {}, name), ...cs.map(c => feedRow(c, c.id + ".ics", upcomingBy[c.id] || 0)));
  }
  $("foot").append(footer());
});
</script>
</body>
</html>
