<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subscribe · Rotaract Events</title>
<meta name="description" content="Subscribe to Rotaract event calendars for Switzerland and Liechtenstein: per club or all clubs, for Apple, Google and Outlook calendars.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="./"><img src="rotaract.svg" alt="Rotaract"><span data-t="events"></span></a>
    <div class="actions" id="actions"><a class="icon-btn" href="./" data-t="back"></a></div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2 data-t="sub_title"></h2>
    <p data-t="sp_intro"></p>
    <div class="how" id="how"></div>
  </section>

  <section class="card" id="all">
    <h2 data-t="sp_all"></h2>
    <p data-t="sp_all_text"></p>
    <div class="feeds" id="feedAll"></div>
  </section>

  <section class="card">
    <h2 data-t="sp_club"></h2>
    <p data-t="sp_club_text"></p>
    <div class="feeds" id="feeds"></div>
  </section>

  <footer><span data-t="made_by"></span> · <a href="https://github.com/Neyxo/rac-event-aggregation-tool" target="_blank" rel="noopener" data-t="source"></a></footer>
</main>

<script>
const $ = id => document.getElementById(id);
applyI18n();
$("actions").prepend(langSelect());
const DISTRICTS = { "1980": t("d1980"), "1990": t("d1990"), "2000": t("d2000"), "": t("national") };
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v); }
  for (const c of children) if (c != null && c !== false) n.append(c);
  return n;
}
function onColor(hex) { const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255); return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.5 ? "#1f1c26" : "#fff"; }
function feedRow(c, file, count) {
  const https = new URL(file, location.href).href, webcal = https.replace(/^https?:/, "webcal:");
  return el("div", { class: "feed" },
    el("div", { class: "name", style: c.color ? `--c:${c.color};--on-c:${onColor(c.color)}` : "" }, c.logo ? el("img", { src: c.logo, alt: "" }) : null,
      c.id ? el("a", { href: "club.html?id=" + c.id, style: "color:inherit;text-decoration:none" }, c.name) : c.name, count != null ? el("span", { class: "meta" }, t("n_upcoming", { n: count })) : null),
    el("div", { class: "l" },
      el("a", { href: webcal }, t("apple")),
      el("a", { href: "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(webcal), target: "_blank", rel: "noopener" }, t("google")),
      el("a", { href: https }, ".ics")));
}
for (const k of ["ios", "google", "android", "outlook"]) {
  $("how").append(el("details", {}, el("summary", {}, t("sp_" + k)), el("ol", {}, ...t("sp_" + k + "_s").map(s => el("li", {}, s)))));
}
(async () => {
  const data = await (await fetch("events.json", { cache: "no-cache" })).json();
  const now = new Date(), upcomingBy = {};
  let total = 0;
  for (const e of data.events) if (new Date(e.end) >= now) { total++; for (const c of e.clubs) upcomingBy[c] = (upcomingBy[c] || 0) + 1; }
  $("feedAll").append(feedRow({ name: t("sp_all_feed") }, "all.ics", total));
  for (const [d, name] of Object.entries(DISTRICTS)) {
    const cs = data.clubs.filter(c => c.district === d).sort((a, b) => a.name.localeCompare(b.name));
    if (cs.length) $("feeds").append(el("h3", {}, name), ...cs.map(c => feedRow(c, c.id + ".ics", upcomingBy[c.id] || 0)));
  }
})();
</script>
</body>
</html>
