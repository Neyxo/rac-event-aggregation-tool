<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · Rotaract Events</title>
<meta name="description" content="Month calendar of Rotaract events in Switzerland and Liechtenstein.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotaract">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
<script src="calendar.js" defer></script>
</head>
<body data-page="calendar" class="calpage">
<a class="skip" href="#main" data-t="skip_to"></a>
<header id="top"></header>
<div class="banner" id="stale" role="status" hidden></div>
<main class="calwrap" id="main">
  <div class="mhead">
    <button type="button" id="prev" data-t-label="prev_month">‹</button>
    <h2 id="mtitle"></h2>
    <div class="seg scope" id="scope" role="group"><button type="button" data-scope="mine" data-t="mine_short"></button><button type="button" data-scope="all" data-t="all_clubs_short"></button></div>
    <button type="button" id="todayBtn" data-t="today"></button>
    <button type="button" id="next" data-t-label="next_month">›</button>
  </div>
  <div class="grid" id="grid" role="grid"></div>
</main>
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-in glass">
    <div class="handle" id="sheetHandle"><i></i></div>
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button type="button" class="linkbtn" id="sheetClose" data-t="close"></button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<nav class="tabs-bar" id="tabs" aria-label="Main"></nav>
<dialog class="ob" id="ob" aria-labelledby="obTitle"><div class="ob-in" id="obBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
