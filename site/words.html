<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotaract words · Rotaract Events</title>
<meta name="description" content="The names and phrases you hear at Rotaract, to look up: Stamm, DRR, charter, RYLA and more.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
</head>
<body data-page="words">
<header id="top"></header>
<!-- the word list: sorted for the language, filtered as you type. Words: nm.words in i18n.js -->
<main class="wrap fam" id="main">
  <h1 id="h"></h1>
  <p class="lead" id="lead"></p>
  <input class="wsearch" type="search" id="q" autocomplete="off">
  <dl class="gloss glass" id="gloss"></dl>
  <p class="fine" id="none" hidden></p>
  <h2 class="sh lv1" data-t="read_on"></h2>
  <div id="more"></div>
  <div id="foot"></div>
</main>
<nav class="tabs-bar" id="tabs" aria-label="Main"></nav>
<div class="toast" id="toast" role="status"></div>
<script defer>
addEventListener("DOMContentLoaded", () => {
  applyI18n(); chrome("about", { back: true }); wash("#009739", "#0067c8", "#d41367");
  const nm = t("nm");
  document.title = nm.words_h + " · Rotaract Events";
  $("h").textContent = nm.words_h; $("lead").textContent = nm.words_sub; $("none").textContent = nm.words_none;
  $("q").placeholder = nm.words_ph; $("q").setAttribute("aria-label", nm.words_ph);
  const rows = nm.words.slice().sort((a, b) => a[0].localeCompare(b[0], LOCALE)).map(([w, d]) => el("div", {}, el("dt", {}, w), el("dd", {}, d)));
  const letters = [], first = r => fold(r.textContent[0]).toUpperCase();
  rows.forEach((r, i) => { if (!i || first(r) !== first(rows[i - 1])) { const l = el("div", { class: "ltr", "aria-hidden": "true" }, first(r)); letters.push(l); $("gloss").append(l); } $("gloss").append(r); });
  $("q").addEventListener("input", () => { const q = fold($("q").value.trim()); let n = 0; for (const r of rows) { r.hidden = !fold(r.textContent).includes(q); n += !r.hidden; } for (const l of letters) l.hidden = !!q; $("gloss").hidden = !n; $("none").hidden = !!n; });
  $("more").append(...helpLinks("guide", "family"));
  $("foot").append(footer());
});
</script>
</body>
</html>
