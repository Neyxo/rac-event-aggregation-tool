<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map · Rotaract Events</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("rac.theme")) === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>const LEAFLET = window.L;</script>
<script src="i18n.js"></script>
<script src="common.js" defer></script>
</head>
<body data-page="map" class="calpage">
<header id="top"></header>
<!-- the map fills the screen between the bars; opened from the map button on Discover -->
<main class="mapwrap" id="main">
  <div id="map"></div>
  <label class="icon-btn mapopt"><input type="checkbox" id="past"> <span data-t="v_past"></span> · <span id="summary"></span></label>
</main>
<nav class="tabs-bar" id="tabs" aria-label="Main"></nav>
<div class="toast" id="toast" role="status"></div>
<script defer>
addEventListener("DOMContentLoaded", async () => {
  applyI18n(); chrome("discover", { back: true });
  const map = LEAFLET.map("map", { minZoom: 7, maxBounds: [[45, 4.5], [48.6, 12]], maxBoundsViscosity: 1 }).setView([46.9, 8.2], 8);  // Switzerland & Liechtenstein, no zooming out to space
  // Swiss national map from swisstopo (free, no key), the grey one so the markers carry the colour
  LEAFLET.tileLayer("https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-grau/default/current/3857/{z}/{x}/{y}.jpeg", { maxZoom: 18, attribution: "© swisstopo" }).addTo(map);
  const layer = LEAFLET.layerGroup().addTo(map);
  await loadData();
  const draw = () => {
    layer.clearLayers();
    const showPast = $("past").checked; let n = 0;
    for (const e of D.data.events) {
      if (!e.coords || (!showPast && isPast(e))) continue;
      n++;
      const c = club(e.clubs[0]);
      LEAFLET.marker(e.coords, { title: e.title, icon: LEAFLET.divIcon({ className: "mapdot", iconSize: [32, 32], popupAnchor: [0, -14], html: `<span style="${clubStyle(c.id)}">${c.logo ? `<img src="${c.logo}" alt="">` : ""}</span>` }) })
        .bindPopup(el("a", { class: "mappop", href: "event.html?id=" + e.id }, el("b", {}, e.title), el("span", {}, `${fmt.dm.format(new Date(e.start))} · ${c.short}`))).addTo(layer);
    }
    $("summary").textContent = nEvents(n);
  };
  $("past").addEventListener("change", draw); draw();
});
</script>
</body>
</html>
