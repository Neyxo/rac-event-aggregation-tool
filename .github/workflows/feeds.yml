name: Build feeds

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write  # commit the event history in data/
  pages: write
  id-token: write

concurrency:
  group: feeds
  cancel-in-progress: false  # never interrupt a history commit

jobs:
  feeds:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The event history lives on the `data` branch, so the bot's commits never land on main.
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - run: python3 test_polaris_feed.py
      # A failing club keeps its last good history; the other clubs still update.
      # The run is marked failed at the end so the problem gets noticed.
      - id: feeds
        continue-on-error: true
        # Instagram pictures: either secret unset (empty) = layer off. See README "Instagram pictures".
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python3 polaris_feed.py clubs.toml public data
      - name: Save event history
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Update event history" && git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - if: steps.feeds.outcome == 'failure'
        run: echo "::error::Some clubs or events failed to sync, see the feeds step" && exit 1
