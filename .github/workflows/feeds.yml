name: Build feeds

on:
  schedule:
    - cron: "17 2 * * *"  # every night, 03:17 or 04:17 in Zurich
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write  # commit the event history in data/
  actions: read  # an app-only push takes the last published site's events (its Pages artifact)
  pages: write
  id-token: write

concurrency:
  group: feeds
  cancel-in-progress: false  # never interrupt a history commit

jobs:
  feeds:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      # The event history lives on the `data` branch, so the bot's commits never land on main.
      - name: Check out the event history
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
      # The web app first: polaris_feed.py copies dist/ into public/. Any failure here stops the run before the
      # deploy, so a broken app never ships (a failing club sync below does not). The nightly run only builds:
      # its code is the last push's, which these checks already passed.
      # Every push to main bumps package.json's version (README, Versions); the pre-push hook checks it locally, this catches a
      # push made without the hook. It fails before the deploy, so an unbumped version never ships.
      - name: Check the version went up
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git fetch --depth=1 origin ${{ github.event.before }}
          old=$(git show ${{ github.event.before }}:package.json | jq -r .version); new=$(jq -r .version package.json)
          echo "version $old -> $new"
          [ "$old" != "$new" ] || { echo "::error::package.json version is still $old: bump it with every push"; exit 1; }
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Lint, typecheck and unit tests
        if: github.event_name != 'schedule'
        run: npm run lint && npm run typecheck && npm test
      - name: Build the app
        run: npm run build
      - name: End-to-end tests
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium && npm run e2e
        env:
          E2E_DIR: dist
      - name: Feed tests
        if: github.event_name != 'schedule'
        run: python3 test_polaris_feed.py
      # Reading every club takes about 6 minutes and gives the same result as last night's run. So a push that changes only the
      # app reuses the events of the last published site (feeds, events.json, status.json, share pages, Instagram pictures)
      # and puts the new app on top. The nightly run, a run by hand and a push that touches the scraper or the club list read
      # everything again.
      - name: Decide whether to read the clubs again
        id: mode
        run: |
          full=true
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            git fetch --depth=1 origin ${{ github.event.before }}
            changed=$(git diff --name-only ${{ github.event.before }} HEAD)
            echo "$changed"
            echo "$changed" | grep -qE '^(polaris_feed\.py|clubs\.toml|test_polaris_feed\.py)$' || full=false
          fi
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
      - name: Reuse the last site's events
        id: reuse
        if: steps.mode.outputs.full == 'false'
        continue-on-error: true  # no usable artifact: the step below reads the clubs instead
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          art=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=1" -q '.artifacts[0] | select(.expired | not) | .id')
          [ -n "$art" ]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > "$RUNNER_TEMP/site.zip"
          mkdir -p "$RUNNER_TEMP/old" && unzip -q "$RUNNER_TEMP/site.zip" -d "$RUNNER_TEMP/zip" && tar -xf "$RUNNER_TEMP/zip/artifact.tar" -C "$RUNNER_TEMP/old"
          [ -s "$RUNNER_TEMP/old/events.json" ] && [ -s "$RUNNER_TEMP/old/all.ics" ]
          rm -rf public && mkdir public && cp -r dist/. public/
          cd "$RUNNER_TEMP/old" && cp -r *.ics events.json status.json e c "$GITHUB_WORKSPACE/public/" && { [ ! -d ig ] || cp -r ig "$GITHUB_WORKSPACE/public/"; }
      # A failing club keeps its last good history; the other clubs still update.
      # The run is marked failed at the end so the problem gets noticed.
      - name: Read the clubs' agendas
        id: feeds
        if: steps.mode.outputs.full == 'true' || steps.reuse.outcome == 'failure'
        continue-on-error: true
        # Instagram pictures: either secret unset (empty) = layer off. See docs/layers.md.
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python3 polaris_feed.py clubs.toml public data
      - name: Save event history
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Update event history" && git push; }
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Fail if a club failed
        if: steps.feeds.outcome == 'failure'
        run: echo "::error::Some clubs or events failed to sync, see the feeds step" && exit 1
